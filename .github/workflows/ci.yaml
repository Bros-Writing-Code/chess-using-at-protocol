name: CI

on:
  pull_request:
  push:
    branches: [main] # re-check main after each merge, so PRs merged in quick succession are checked together

permissions:
  contents: read

env:
  # pa11y-ci's Puppeteer downloads Chrome on every npm ci. Runners already have Chrome.
  PUPPETEER_SKIP_DOWNLOAD: true

concurrency:
  # PRs share a group per branch, so a new push cancels the outdated run.
  # Pushes to main use the unique run_id, so every merge gets its own full run.
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Job names are the PR status check names, so renaming one breaks branch protection's required checks.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }} # repo variable; vite.config.js turns it into the base path (see docs/deployment.md)
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' # PRs never produce a deployable artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Report only: not a required check and deploy doesn't wait for it. Will have it required once we fix the outstanding errors.
  a11y:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
      # Job-wide: the build, the preview server and .pa11yci.cjs all read it and must agree.
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run a11y

  deploy:
    needs: [lint, format, test, build] # deploy only if every check passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write # lets Pages verify the run comes from this repo
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Runs on main aren't grouped, so when two merges land close together the older build can
    # deploy last. If the live site looks stale, re-run the newest CI run on main.
    concurrency:
      group: pages
      cancel-in-progress: false # never cut off a deploy halfway
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
